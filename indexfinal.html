<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b14">
  <title>Anime Universe | 3D Image Gallery</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="page-header">
    <p class="eyebrow">A 3D IMAGE GALLERY</p>
    <h1>Anime <span>Universe</span></h1>
    <p class="subtitle">Move your pointer over an image to bring it forward.</p>
  </header>

  <main>
    <section class="gallery-wrap" aria-label="Interactive anime image gallery">
      <div class="list">
        <figure class="item"><img src="1.jpg" alt="Anime collage in monochrome and blue tones" loading="eager"><figcaption>01 · Collage</figcaption></figure>
        <figure class="item"><img src="2.jpg" alt="Dark blue anime character collage" loading="lazy"><figcaption>02 · Midnight</figcaption></figure>
        <figure class="item"><img src="3.jpg" alt="Blue-toned anime character artwork" loading="lazy"><figcaption>03 · Blue Hour</figcaption></figure>
        <figure class="item"><img src="4.jpg" alt="Red and black anime character collage" loading="lazy"><figcaption>04 · Crimson</figcaption></figure>
        <figure class="item"><img src="5.jpg" alt="Anime swordsman surrounded by blue water effects" loading="lazy"><figcaption>05 · Tidal Force</figcaption></figure>
        <figure class="item"><img src="6.jpg" alt="Anime swordsman surrounded by green energy" loading="lazy"><figcaption>06 · Emerald</figcaption></figure>
        <figure class="item"><img src="7.jpg" alt="Anime swordsman in a glowing green forest" loading="lazy"><figcaption>07 · Wild Spirit</figcaption></figure>
        <figure class="item"><img src="8.jpg" alt="Anime pirate facing a towering ocean wave" loading="lazy"><figcaption>08 · Ocean</figcaption></figure>
        <figure class="item"><img src="9.jpg" alt="Anime character surrounded by golden lightning" loading="lazy"><figcaption>09 · Thunder</figcaption></figure>
        <figure class="item"><img src="10.jpg" alt="Anime warrior surrounded by red energy" loading="lazy"><figcaption>10 · Inferno</figcaption></figure>
      </div>
    </section>
  </main>

  <footer><span>HTML + CSS · 3D transforms · Hover interactions</span><span>Use Tab to focus the gallery images.</span></footer>
</body>
</html>
